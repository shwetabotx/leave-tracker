<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Leave Tracker</title>

    <!-- Bootstrap CSS Min Version -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container py-4">

        <h1 class="text-center mb-4">
            Employee Leave Tracker
        </h1>
        <!-- Leave Request Form -->

        <div class="card mb-4">

            <div class="card-header">
                Leave Request Form
            </div>

            <div class="card-body">

                <form id="leaveForm">

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label class="form-label">
                                Employee Name
                            </label>

                            <input type="text" class="form-control" id="employeeName">

                            <small id="employeeNameError" class="text-danger">
                            </small>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                Employee ID
                            </label>

                            <input type="text" class="form-control" id="employeeId">

                            <small id="employeeIdError" class="text-danger">
                            </small>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                Leave Type
                            </label>

                            <select class="form-select" id="leaveType">

                                <option value="">
                                    Select Leave Type
                                </option>

                                <option value="Casual Leave">
                                    Casual Leave
                                </option>

                                <option value="Sick Leave">
                                    Sick Leave
                                </option>

                                <option value="Earned Leave">
                                    Earned Leave
                                </option>

                                <option value="Work From Home">
                                    Work From Home
                                </option>

                            </select>

                            <small id="leaveTypeError" class="text-danger">
                            </small>

                        </div>

                        <div class="col-md-3">

                            <label class="form-label">
                                Start Date
                            </label>

                            <input type="date" class="form-control" id="startDate">

                            <small id="startDateError" class="text-danger">
                            </small>

                        </div>

                        <div class="col-md-3">

                            <label class="form-label">
                                End Date
                            </label>

                            <input type="date" class="form-control" id="endDate">

                            <small id="endDateError" class="text-danger">
                            </small>

                        </div>

                        <div class="col-12">

                            <label class="form-label">
                                Reason
                            </label>

                            <textarea rows="3" class="form-control" id="reason">
                            </textarea>

                            <small id="reasonError" class="text-danger">
                            </small>

                        </div>

                        <div class="col-md-4">

                            <label class="form-label">
                                Status
                            </label>

                            <select class="form-select" id="status">

                                <option value="Pending" selected>
                                    Pending
                                </option>

                                <option value="Approved">
                                    Approved
                                </option>

                                <option value="Rejected">
                                    Rejected
                                </option>

                            </select>

                            <small id="statusError" class="text-danger">
                            </small>

                        </div>

                    </div>

                    <button class="btn btn-primary mt-4" type="submit">

                        Submit Request

                    </button>

                </form>

            </div>

        </div>

        <!-- Search & Filter Section -->

        <div class="card mb-4">

            <div class="card-header">
                Search & Filter
            </div>

            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-4">

                        <input type="text" class="form-control" id="searchInput" placeholder="Search Employee">

                    </div>

                    <div class="col-md-3">

                        <select class="form-select" id="statusFilter">

                            <option value="all">
                                All Status
                            </option>

                            <option value="Pending">
                                Pending
                            </option>

                            <option value="Approved">
                                Approved
                            </option>

                            <option value="Rejected">
                                Rejected
                            </option>

                        </select>

                    </div>

                    <div class="col-md-3">

                        <select class="form-select" id="leaveTypeFilter">

                            <option value="all">
                                All Leave Types
                            </option>

                            <option value="Casual Leave">
                                Casual Leave
                            </option>

                            <option value="Sick Leave">
                                Sick Leave
                            </option>

                            <option value="Earned Leave">
                                Earned Leave
                            </option>

                            <option value="Work From Home">
                                Work From Home
                            </option>

                        </select>

                    </div>

                    <div class="col-md-2">

                        <select class="form-select" id="sortFilter">

                            <option value="none">
                                Sort By
                            </option>

                            <option value="name">
                                Employee Name (A-Z)
                            </option>

                            <option value="startDate">
                                Start Date
                            </option>

                            <option value="endDate">
                                End Date
                            </option>

                            <option value="createdDate">
                                Created Date
                            </option>

                        </select>

                    </div>

                </div>

            </div>

        </div>

        <div class="card">

            <div class="card-header">
                Leave Requests
            </div>

            <div class="card-body table-responsive">

                <table class="table table-bordered table-hover align-middle">

                    <thead>

                        <tr>

                            <th>Name</th>

                            <th>ID</th>

                            <th>Leave Type</th>

                            <th>Start</th>

                            <th>End</th>

                            <th>Days</th>

                            <th>Status</th>

                            <th>Created</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="leaveTableBody">

                        <tr>

                            <td colspan="9" class="text-center">

                                No Leave Requests Found

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
